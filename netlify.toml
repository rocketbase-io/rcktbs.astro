# Alte, weiterhin indexierte URLs aus der Search Console (Pos. 3,2 bzw. 3,1) -
# ohne Trailing Slash ergaenzt, damit beide Varianten sauber weiterleiten.
[[redirects]]
  from = "/imprint/"
  to = "/impressum/"
  status = 301

[[redirects]]
  from = "/privacy/"
  to = "/datenschutz/"
  status = 301

[[redirects]]
  from = "/contact/"
  to = "/kontakt/"
  status = 301

[[redirects]]
  from = "/services/"
